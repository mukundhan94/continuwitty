<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Engram Vault Login</title>
    <style>
      body {
        margin: 0;
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(120deg, #0f172a, #1e293b);
        min-height: 100vh;
        display: grid;
        place-items: center;
        color: #e2e8f0;
      }
      .card {
        width: min(420px, 92vw);
        background: rgba(15, 23, 42, 0.88);
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.3rem;
      }
      p {
        margin: 0 0 16px;
        color: #cbd5e1;
      }
      label {
        display: block;
        margin: 12px 0 6px;
        font-size: 0.9rem;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #475569;
        border-radius: 8px;
        padding: 10px 12px;
        background: #0b1220;
        color: #f8fafc;
      }
      button {
        margin-top: 16px;
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 10px 12px;
        font-weight: 600;
        background: #22c55e;
        color: #052e16;
        cursor: pointer;
      }
      .error {
        margin-top: 12px;
        border-radius: 8px;
        background: rgba(220, 38, 38, 0.2);
        border: 1px solid rgba(239, 68, 68, 0.5);
        color: #fecaca;
        padding: 8px 10px;
      }
      .hint {
        margin-top: 10px;
        font-size: 0.82rem;
        color: #94a3b8;
      }
      code {
        background: #0b1220;
        border: 1px solid #334155;
        border-radius: 6px;
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Engram Vault Test UI</h1>
      <p>Sign in to access the local testing dashboard.</p>
      <form method="post" action="/login">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required />
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit">Sign in</button>
      </form>
      {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
      <div class="hint">
        Local default credentials: <code>admin</code> / <code>admin123</code>
      </div>
    </main>
  </body>
</html>
