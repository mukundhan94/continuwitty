name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - migrate
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-backend:
    name: Go Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Run unit tests
        run: go test ./... -count=1

  web-frontend:
    name: Web Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run unit tests
        working-directory: web
        run: npm run test

  acceptance-mock:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs:
      - go-backend
      - web-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run mock acceptance suite (docker)
        run: make acceptance-test-mock-docker
