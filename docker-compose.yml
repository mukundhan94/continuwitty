services:
  db:
    image: pgvector/pgvector:pg16
    container_name: engram-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-engram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-engram}
      POSTGRES_DB: ${POSTGRES_DB:-engram_vault}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-engram} -d ${POSTGRES_DB:-engram_vault}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: engram-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-engram}:${POSTGRES_PASSWORD:-engram}@db:5432/${POSTGRES_DB:-engram_vault}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-256}
      APP_ENV: ${APP_ENV:-development}
      APP_SEMANTIC_VERSION: ${APP_SEMANTIC_VERSION:-0.1.0}
      APP_COMMIT_SHA: ${APP_COMMIT_SHA:-unknown}
      LOG_CONFIG_IN_DEV: ${LOG_CONFIG_IN_DEV:-true}
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:-engram-local-dev-session-secret}
      UI_DEMO_USERNAME: ${UI_DEMO_USERNAME:-admin}
      UI_DEMO_PASSWORD: ${UI_DEMO_PASSWORD:-admin123}
      UI_DEMO_PASSWORD_HASH: ${UI_DEMO_PASSWORD_HASH:-}
      LANGGRAPH_CHECKPOINT_PATH: ${LANGGRAPH_CHECKPOINT_PATH:-/srv/data/langgraph_checkpoints.sqlite}
      AUDIT_LOG_PATH: ${AUDIT_LOG_PATH:-/srv/data/audit_events.jsonl}
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: ${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}
      LOGIN_RATE_LIMIT_MAX_ATTEMPTS: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:-5}
      LOGIN_LOCKOUT_SECONDS: ${LOGIN_LOCKOUT_SECONDS:-900}
      DEFAULT_CHAT_PROVIDER: ${DEFAULT_CHAT_PROVIDER:-openai}
      DEFAULT_CHAT_MODEL: ${DEFAULT_CHAT_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      ANTHROPIC_VERSION: ${ANTHROPIC_VERSION:-2023-06-01}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/srv/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz').read()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: engram-web
    restart: unless-stopped
    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://api:8000}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-web,localhost,127.0.0.1}
      VITE_DEFAULT_PROJECT_ID: ${VITE_DEFAULT_PROJECT_ID:-engram-vault}
      VITE_DEFAULT_PROVIDER: ${VITE_DEFAULT_PROVIDER:-bedrock}
      VITE_DEFAULT_VISIBILITY: ${VITE_DEFAULT_VISIBILITY:-private}
      VITE_DEFAULT_OPENAI_MODEL: ${VITE_DEFAULT_OPENAI_MODEL:-eu.anthropic.claude-haiku-4-5-20251001-v1:0}
      VITE_DEFAULT_ANTHROPIC_MODEL: ${VITE_DEFAULT_ANTHROPIC_MODEL:-claude-3-5-haiku-20241022}
      VITE_DEFAULT_BEDROCK_MODEL: ${VITE_DEFAULT_BEDROCK_MODEL:-eu.anthropic.claude-haiku-4-5-20251001-v1:0}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  acceptance-tests:
    build:
      context: .
      dockerfile: acceptance-tests/Dockerfile
    profiles:
      - acceptance
    environment:
      WEB_BASE_URL: ${ACCEPTANCE_WEB_BASE_URL:-http://web:5173}
      API_BASE_URL: ${ACCEPTANCE_API_BASE_URL:-http://api:8000}
      UI_USERNAME: ${UI_DEMO_USERNAME:-admin}
      UI_PASSWORD: ${UI_DEMO_PASSWORD:-admin123}
      ACCEPTANCE_BDD_TAGS: "${ACCEPTANCE_BDD_TAGS:-not @bedrock-live}"
      BEDROCK_LIVE_EXPECTED_MODEL: ${BEDROCK_LIVE_EXPECTED_MODEL:-}
      BEDROCK_LIVE_PROMPT: ${BEDROCK_LIVE_PROMPT:-}
      BEDROCK_LIVE_MIN_RESPONSE_CHARS: ${BEDROCK_LIVE_MIN_RESPONSE_CHARS:-20}
      PW_HEADLESS: ${PW_HEADLESS:-true}
      PW_TIMEOUT_MS: ${PW_TIMEOUT_MS:-45000}
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./acceptance-tests/artifacts:/work/acceptance-tests/artifacts
    command: ["npm", "run", "test"]

volumes:
  pgdata:
