name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - migrate
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      run_live_provider:
        description: "Run optional live-provider release gate"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  go-backend:
    name: Go Backend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify formatting
        run: |
          set -euo pipefail
          files="$(find cmd internal -name '*.go' -type f)"
          unformatted="$(gofmt -l $files)"
          if [ -n "$unformatted" ]; then
            echo "Go files require formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -count=1

      - name: Run EvalOps delta gate
        run: make eval

  web-frontend:
    name: Web Frontend Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run lint
        working-directory: web
        run: npm run lint

      - name: Run tests
        working-directory: web
        run: npm run test

      - name: Run build
        working-directory: web
        run: npm run build

  acceptance-mock:
    name: Acceptance Deterministic Suite
    runs-on: ubuntu-latest
    needs:
      - go-backend
      - web-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run mock acceptance suite (docker)
        run: make acceptance-test-mock-docker

  release-smoke:
    name: Release Smoke (Compose Profile)
    runs-on: ubuntu-latest
    needs:
      - go-backend
      - web-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run release smoke profile
        run: make release-smoke-docker

  release-live-provider:
    name: Release Live-Provider Gate
    runs-on: ubuntu-latest
    needs:
      - acceptance-mock
      - release-smoke
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_provider == true }}
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      BEDROCK_LIVE_EXPECTED_MODEL: ${{ secrets.BEDROCK_LIVE_EXPECTED_MODEL }}
      BEDROCK_LIVE_PROMPT: ${{ secrets.BEDROCK_LIVE_PROMPT }}
      BEDROCK_LIVE_MIN_RESPONSE_CHARS: "20"
      UI_DEMO_USERNAME: "admin"
      UI_DEMO_PASSWORD: "admin123"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate live-provider secrets
        run: |
          set -euo pipefail
          required=(
            AWS_REGION
            AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY
            BEDROCK_LIVE_EXPECTED_MODEL
          )
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required secret/env: $key"
              exit 1
            fi
          done

      - name: Run live-provider release gate
        run: make release-live-provider-gate
