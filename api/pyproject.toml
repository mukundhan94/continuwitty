[project]
name = "engram-vault-api"
version = "0.1.0"
description = "Local-first memory engram API"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.0",
  "httpx==0.28.1",
  "boto3==1.37.8",
  "psycopg[binary]==3.2.6",
  "pydantic==2.10.6",
  "pydantic-settings==2.8.1",
  "jinja2==3.1.5",
  "python-multipart==0.0.20",
  "itsdangerous==2.2.0",
  "langgraph==0.6.8",
  "langgraph-checkpoint-sqlite==2.0.11",
  "langfuse>=3.14.1",
]

[dependency-groups]
dev = [
  "pytest==8.3.5",
  "ruff==0.9.7",
]

[tool.pytest.ini_options]
markers = [
  "integration: tests that require a running local Postgres/pgvector",
]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
