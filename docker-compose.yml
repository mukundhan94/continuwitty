services:
  db:
    image: pgvector/pgvector:pg16
    container_name: engram-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-engram}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-engram}
      POSTGRES_DB: ${POSTGRES_DB:-engram_vault}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-engram} -d ${POSTGRES_DB:-engram_vault}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
